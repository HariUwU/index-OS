<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- WILL OF THE CITY :: THE INDEX — pixel font default, Thai + glyph fallback -->

  <!-- Latin pixel font falls back to the Thai build, then DejaVu -->
  <alias>
    <family>Perfect DOS VGA 437</family>
    <prefer>
      <family>Perfect DOS VGA 437 Thai</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- any Thai text prefers the Thai pixel build -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>th</string></test>
    <edit name="family" mode="prepend"><string>Perfect DOS VGA 437 Thai</string></edit>
  </match>

  <!-- make the pixel font the default sans/serif/mono everywhere -->
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Perfect DOS VGA 437</string></edit></match>
  <match target="pattern"><test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Perfect DOS VGA 437</string></edit></match>
</fontconfig>
